# Nirmaan OS on Fly.io (the public website stays on Vercel). Singapore: the nearest
# region to India that this account can use (Mumbai isn't offered).
# Deploy from the repo root: fly deploy. Setup: docs/engineering/deployment.md.
app = "nirmaan-os"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.os"

[env]
  # Server dates in India time, so daily counts (emails sent today, budgets) reset at midnight IST.
  TZ = "Asia/Kolkata"
  NIRMAAN_OS_URL = "https://os.nirmaan.online"
  NIRMAAN_INTAKE_ORIGINS = "https://nirmaan.online,https://www.nirmaan.online"
  NIRMAAN_PASSWORD_LOGIN = "off"
  # The campaign worker (Gmail poller and sender) starts only when this is exactly "on"
  # (os/scripts/start.sh). Off, a deploy serves the web app alone.
  NIRMAAN_WORKER = "off"

[http_service]
  internal_port = 3000
  force_https = true
  # Screens on, worker off (founder, 2026-10-17): a request wakes the machine and it
  # stops again when idle; NIRMAAN_WORKER above stays "off". Email, inbox, Places and
  # Claude credentials are not set on Fly. Turning the worker back on: the checklist
  # in docs/engineering/deployment.md.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[mounts]]
  source = "nirmaan_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
