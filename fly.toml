# Nirmaan OS on Fly.io (the public website stays on Vercel). Singapore: the nearest
# region to India that this account can use (Mumbai isn't offered).
# Deploy from the repo root: fly deploy. Setup: docs/engineering/deployment.md.
app = "nirmaan-os"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.os"

[env]
  NIRMAAN_OS_URL = "https://os.nirmaan.online"
  NIRMAAN_INTAKE_ORIGINS = "https://nirmaan.online,https://www.nirmaan.online"
  NIRMAAN_PASSWORD_LOGIN = "off"

[http_service]
  internal_port = 3000
  force_https = true
  # The campaign worker runs in this machine, so it must never be stopped for idling.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[mounts]]
  source = "nirmaan_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
