# Nirmaan OS: test every change with the checks AGENTS.md requires before merge
# (a fresh database from the committed migrations, typecheck, lint, unit tests,
# next build). It deploys nothing: the OS is paused (2026-10-17) and its deploy
# job was removed; see docs/engineering/deployment.md.
#
# The four checks run as parallel jobs (os-typecheck, os-lint, os-unit,
# os-build), each from the same install (.github/actions/os-install). The job
# `os-test` needs all four and passes only when every one succeeded. It runs
# even when one failed or was cancelled (`if: always()`), because a skipped
# job reports as passing and would not block a merge. Its id and name are both
# `os-test`, unique across the repository's workflows, so a ruleset can require
# it by name. Every job has a timeout. No path filter, so it can be a required
# check without docs-only pull requests waiting on it forever. The public
# website isn't touched here (Vercel publishes it on its own).
# Actions are pinned by commit SHA, with the release in a comment.
name: Nirmaan OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  os-typecheck:
    name: os-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/os-install
      - name: Typecheck
        run: npm run typecheck

  os-lint:
    name: os-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/os-install
      - name: Lint
        run: npm run lint

  os-unit:
    name: os-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/os-install
      # A fresh checkout has no database (prisma/dev.db is git-ignored), so this
      # builds one from scratch out of the committed migrations (DATABASE_URL
      # comes from the tracked, non-secret os/.env).
      - name: Migrate a fresh database
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm test

  os-build:
    name: os-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/os-install
      - name: Migrate a fresh database
        run: npx prisma migrate deploy
      # Next's incremental build cache (os/.next/cache only, never the build
      # output). The key follows the lockfile and the sources; an older cache is
      # a starting point that Next checks and rebuilds from.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: os/.next/cache
          key: os-next-${{ runner.os }}-${{ hashFiles('os/package-lock.json') }}-${{ hashFiles('os/src/**', 'os/public/**', 'os/next.config.ts', 'os/tsconfig.json') }}
          restore-keys: |
            os-next-${{ runner.os }}-${{ hashFiles('os/package-lock.json') }}-
      - name: Production build
        run: npx next build

  os-test:
    name: os-test
    needs: [os-typecheck, os-lint, os-unit, os-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every OS check passed
        env:
          TYPECHECK: ${{ needs.os-typecheck.result }}
          LINT: ${{ needs.os-lint.result }}
          UNIT: ${{ needs.os-unit.result }}
          BUILD: ${{ needs.os-build.result }}
        run: |
          echo "os-typecheck: $TYPECHECK"
          echo "os-lint: $LINT"
          echo "os-unit: $UNIT"
          echo "os-build: $BUILD"
          for result in "$TYPECHECK" "$LINT" "$UNIT" "$BUILD"; do
            if [ "$result" != success ]; then
              echo "::error::An OS check did not succeed; os-test fails."
              exit 1
            fi
          done
