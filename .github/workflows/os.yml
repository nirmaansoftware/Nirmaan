# Nirmaan OS: test every change (typecheck, lint, unit tests). It deploys nothing:
# the OS is paused (2026-10-17) and its deploy job was removed; see
# docs/engineering/deployment.md. No path filter, so this can be a required check
# without docs-only pull requests waiting on it forever. The public website isn't
# touched here (Vercel deploys it on its own).
# Actions are pinned by commit SHA, with the release in a comment.
name: Nirmaan OS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
