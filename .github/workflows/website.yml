# Website: check that the committed site (website/public, which Vercel publishes
# as is, with no build step) is exactly what a fresh build of website/src makes,
# that the CSP in vercel.json has the hash of every inline script, and that
# every internal link in it resolves. It deploys nothing.
#
# The job id and name are both `website-build`, unique across the repository's
# workflows, so a ruleset can require it by name. No path filter, so it can be a
# required check without other pull requests waiting on it forever.
# Actions are pinned by commit SHA, with the release in a comment.
#
# 1 January: website/src/_data/build.js puts the current year in every page
# footer, so from 1 January a fresh build differs from the committed public/
# and this job fails on every pull request until someone runs `npm run build`
# in website/ and commits public/ (a one-line year change per page). Do that
# rebuild as its own small PR on the first working day of the year.
name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website-build:
    name: website-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: sitemap.xml's <lastmod> is each page's last commit
          # (the lastModified filter in website/.eleventy.js). A shallow clone
          # would date every page to the one commit fetched.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      # Build into an empty public/ so a page whose source was removed shows up
      # as a deleted file instead of lingering (Eleventy never deletes output).
      # A build from empty reproduces every committed file, static copies too.
      - name: Build from empty (npm run build)
        run: |
          rm -rf public
          npm run build
      # Fails on stale files (src changed, public not rebuilt), hand edits to
      # public/, generated files never committed (untracked counts), and
      # committed files no source makes any more (they show as deleted).
      # sitemap.xml has no exception: its <lastmod> dates come from git
      # history, so they are the same on every full-history checkout. A
      # <lastmod> difference means public/ was built before the page's source
      # change was committed.
      - name: Committed public/ matches a fresh build
        working-directory: .
        run: |
          changes="$(git status --porcelain --untracked-files=all -- website/public)"
          if [ -n "$changes" ]; then
            echo "::error::website/public differs from a fresh build. Commit the source change, then run 'npm run build' in website/ and commit public/."
            echo "$changes"
            git --no-pager diff --stat -- website/public
            exit 1
          fi
          echo "website/public matches a fresh build."
      - name: Link checker tests
        working-directory: .
        run: node --test .github/scripts/check-links.test.mjs
      # The CSP in vercel.json allows inline scripts by hash only. These
      # recompute the hash of every inline script in the fresh build and fail
      # when vercel.json lacks one or keeps one no page uses.
      - name: CSP hash checker tests
        working-directory: .
        run: node --test .github/scripts/check-csp.test.mjs
      - name: CSP script-src has every inline script's hash
        working-directory: .
        run: node .github/scripts/check-csp.mjs website/public website/src/static/vercel.json
      - name: Internal links resolve
        working-directory: .
        run: |
          site="$(node -p "require('./website/src/_data/site.json').url")"
          node .github/scripts/check-links.mjs website/public --site "$site"
