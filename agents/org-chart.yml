# Nirmaan org chart: the line of command of the agent roles (employees).
#
# This file is the one source of truth for who reports to whom. Every other
# view is generated from it or checked against it by
# .github/scripts/org-chart.mjs (run by repo-checks):
#   - the team table in agents/README.md is generated from it
#     (node .github/scripts/org-chart.mjs --write);
#   - the teams and leads in .github/review-teams.yml must equal its active
#     key-1 units and their heads.
# Decisions behind it: docs/operations/capability-hierarchy-decisions.md
# (D1 span, activation and exceptions; D2 the target chart, the interim chart,
# stage ownership and titles; D3 this file and its checks; section 4 the hire
# list that `hire` labels follow). Each rule is also stated in this header or
# in org-chart.mjs and enforced there.
# Changing this file is founder class A (agents/**).
#
# Layers: 0 the founder (human), 1 the agent apex, 2 a chief, 3 a VP,
# 4 a head of department, 5 a lead (only above 8 ICs), 6 an individual
# contributor. Staff positions hold authority over a subject, no line and no
# key. Every position is held by an agent unless `holder: human`.
#
# Positions and slugs are kept apart: `occupant` is the agents/<slug>/ that
# holds a position today, so a promotion moves an occupant and renames
# nothing in agents/ or review-teams.yml.
#   - status active: the position is held now. An active position reports to
#     an active position (`reports_to` is today's line manager).
#   - status planned: the position exists in the plan and holds nothing (no
#     key, deputy duty, path, skill or stage). `reports_to` is its line in the
#     target chart; until it activates, its reports report to its nearest
#     active ancestor. `hire` is the hiring PR (H1 to H16, in the record's
#     hire list) and its wave; the order can change. `target_occupant`
#     names an existing agent that will move into it.
#   - `interim: true`: today's review teams, recorded as interim units with
#     their current heads and keys. Each hiring PR splits an interim unit
#     into target units and ends it; interim positions are not part of the
#     target chart.
#   - `target_reports_to`: an active position's line in the target chart,
#     when it differs from today's.
#   - `plannable: false`: an ic or staff position the delivery planner never
#     assigns tasks to (managers never own tasks).
#
# Units: an interim unit's members are the positions reporting to its head
# today; any other unit's members are the positions whose target line is its
# head. `key: 1` units are the review teams that hold key 1.

version: 1

# One legal entity or two is the founder's decision. Drafts take party names
# only from this field, never from unit names.
legal_entity: undetermined

# Specs the chart does not place, each with the reason. An unplaced spec holds
# no position, and nothing here decides where it would sit.
unplaced:
  - slug: founder-proxy
    reason: "The decision meeting did not place the Founder Proxy (agent) in the chart (decision record, note at the top, and section 9, item 10); this chart leaves it outside the agent line."

