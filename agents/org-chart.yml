# Stage map: every lead status and every project stage
# (os/src/lib/db/enums.ts) has exactly one owning unit and one client-voice
# unit, both active. `target_owner` and `target_client_voice` are the target
# units. Until Commercial is active, Business holds its stages; until
# Delivery is active, Product owns APPROVED to DEPLOYMENT and MAINTENANCE;
# until Platform is active, Platform and Quality owns MONITORING. In every
# stage client-communication drafts and a person sends; no agent position
# grants an OS role or holds a project gate.
stages:
  - id: lead-pipeline
    kind: lead
    statuses: [NEW, DISCOVERY, QUALIFIED, PROPOSAL, WON, LOST, SPAM]
    owner: business
    client_voice: business
    target_owner: commercial
    target_client_voice: commercial
  - id: project-lead
    kind: project
    statuses: [LEAD]
    owner: business
    client_voice: business
    target_owner: commercial
    target_client_voice: commercial
  - id: project-scope
    # Product supplies the scope facts.
    kind: project
    statuses: [DISCOVERY, REQUIREMENTS]
    owner: product
    client_voice: business
    target_owner: product-target
    target_client_voice: commercial
  - id: project-pricing
    # finance-estimation drafts the estimate and the founder sets the client
    # price; before a proposal is sent, the engineering head who would staff
    # the project records a feasibility check.
    kind: project
    statuses: [ESTIMATION, PROPOSAL]
    owner: business
    client_voice: business
    target_owner: commercial
    target_client_voice: commercial
  - id: project-build
    kind: project
    statuses: [APPROVED, PLANNING, DESIGN, ARCHITECTURE, IMPLEMENTATION, QA, SECURITY_REVIEW, DEPLOYMENT]
    owner: product
    client_voice: business
    target_owner: delivery
    target_client_voice: delivery
  - id: project-monitoring
    kind: project
    statuses: [MONITORING]
    owner: platform-quality
    client_voice: business
    target_owner: platform
    target_client_voice: commercial
  - id: project-maintenance
    kind: project
    statuses: [MAINTENANCE]
    owner: product
    client_voice: business
    target_owner: delivery
    target_client_voice: commercial

# Exceptions to span or deputies. Each has a reason and a review_by date; the
# validator fails once the date has passed, and fails an exception that no
# longer excuses anything.
exceptions:
  - position: head-product-interim
    rule: span
    reason: "Product (interim) has 2 members until Head of Product and product-owner are hired (H10, wave 6)."
    review_by: "2027-01-18"
  - position: head-platform-quality-interim
    rule: deputy
    reason: "The decided deputy, appsec-engineer, joins in H1; no current member was named deputy."
    review_by: "2027-01-18"
  - position: head-business-interim
    rule: deputy
    reason: "Business (interim) is led by legal-compliance, and Legal and Compliance has no deputy; legal-counsel is never a deputy. Ends with H2."
    review_by: "2027-01-18"
  - position: head-legal-compliance
    rule: deputy
    reason: "Legal and Compliance has no deputy, permanently: if Legal's key 1 defers, the PR stops for the founder."
    review_by: "2027-10-18"
